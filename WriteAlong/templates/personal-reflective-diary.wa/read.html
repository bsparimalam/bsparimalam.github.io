## Morning Pages — Autumn Field Reflections

**Location:** Cascadia Ridge Cabin · **Weather:** Crisp 7°C, high silver clouds, scent of damp hemlock  
**Energy:** Calm & focused · **Reading:** *The Practice of the Wild* (Gary Snyder)

Woke twenty minutes before the alarm to the sound of jays arguing in the cedar canopy. Made pour-over coffee in the enamel kettle and sat at the south window while mist lifted slowly off the valley floor. Notice how differently a day unfolds when the first forty minutes belong to a paper notebook rather than an inbox.[^1]

This week's anchor intention is simple: **finish fewer things more completely**. Last month I scattered attention across six half-started sketches and felt oddly drained despite busy afternoons. Choosing two meaningful creative anchors per day—and letting the rest wait without guilt—already feels lighter.

> "Attention is the rarest and purest form of generosity—both toward the people we love and toward the ordinary craft in front of our hands."

### Three Small Gratitudes Today

1. The unexpected phone call from Maya sharing photos from her Lisbon residency.
2. Finding the brass fountain pen I thought I had misplaced on the October train.
3. A quiet thirty-minute walk under golden larch trees before the afternoon rain returned.

---

## Weekly Focus & Habit Tracker

Keeping habits modest makes them resilient even during travel or busy deadlines. Here is the honest scorecard for Week 47:

| Daily Practice | Mon | Tue | Wed | Thu | Fri | Sat | Sun | Notes |
|---|:---:|:---:|:---:|:---:|:---:|:---:|:---:|---|
| 25-min Morning Writing | ✓ | ✓ | ✓ | — | ✓ | ✓ | ✓ | Best sessions before 7:30 AM |
| 6 km Walk / Trail Run | ✓ | — | ✓ | ✓ | — | ✓ | ✓ | Muddy switchbacks on Saturday |
| Reading (30+ pages) | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | Finished Ch. 4–8 |
| Phone-Free Evening | — | ✓ | ✓ | ✓ | — | ✓ | ✓ | Much deeper sleep quality |
| Watercolor / Sketch | — | — | ✓ | — | — | ✓ | ✓ | Cedar cone & ridge elevation |

![Field Sketch Plate: Seasonal cadence and reflection rhythm for November.](images/figure-1.svg)

> [!TIP]
> **Sunday Reset Ritual**: Spend 15 minutes reviewing completed tasks, clearing the desk surface, and picking the single most important priority for Monday morning.

## Project Notes & Action Items

### Studio & Creative Projects
- [x] Organize autumn photographs into dated archive folders with captions
- [x] Refine CSS typography for the personal essay chapbook
- [ ] Frame the two botanical linocuts for the hallway wall
- [ ] Draft thank-you letters to friends who hosted us during the coast trip

### Home, Kitchen & Errands
- [x] Sharpen kitchen chef's knife and oil the maple cutting board
- [x] Order winter seeds (sweet peas, kale, rosemary) for February cold frames
- [ ] Repair the loose brass hinge on the porch lantern
- [ ] Bake sourdough focaccia and fennel ragout for Sunday dinner

---

## Travel & Field Log — Ridge Loop Trail

Started from the upper trailhead at 8:15 AM carrying tea in a thermos, binoculars, and the pocket field journal. The first mile climbed steadily through sword ferns and mossy nurse logs; by mile two the forest opened onto basalt talus with sweeping views toward the snow-dusted northern peaks.

<!-- .pull-quote -->
> Halfway up the switchback I spotted a pair of varied thrushes feeding quietly among the salal berries—flashes of burnt orange and slate blue against wet evergreen shadow.

### Trail Observations

- **Elevation Gain**: 480 meters over 8.4 km round trip.
- **Flora Noted**: Western redcedar, vine maple in final crimson leaf, pale lichen curtains on Douglas fir.
- **Sketch Idea**: Study how low November sunlight turns wet bark almost plum-colored against bright moss.

## Evening Wind-Down & Tomorrow's First Step

Tomorrow morning, open the manuscript directly to Section 3 and write 500 unedited words before checking any messages. Leave the fountain pen uncapped beside the lamp, turn down the stove damper, and call it a good, honest day.[^2]

[^1]: Archived in the 2026 Personal Field Journal series (Volume IV).

  --body-font: "Source Serif 4", Georgia, "Times New Roman", serif;
  --heading-font: "Source Serif 4", Georgia, serif;
  --code-font: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --body-size: 11pt;
  --line-height: 1.55;
  --scale: 1.25;
  --paragraph-spacing: 0.8em;
  --paragraph-indent: 0;
  --radius: 4px;

  --columns: 1;
  --column-gap: 0.3in;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}

body {
  margin: 0;
  padding: 0;
  font-family: var(--body-font);
  font-size: var(--body-size);
  line-height: var(--line-height);
  color: var(--text-color);
  background: var(--page-background);
}

/* ==========================================================================
   Discrete Physical Pages (.wa-pages > .wa-page)
   ========================================================================== */

.wa-pages {
  counter-reset: sec;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.wa-pages.wa-staging {
  position: fixed !important;
  left: -24000px !important;
  top: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}

.wa-page {
  width: var(--page-width, 8.5in);
  height: var(--page-height, 11in);
  background: var(--page-background, #ffffff);
  color: var(--text-color);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  overflow-wrap: break-word;
}

/* Printable content box positioned identically to physical @page margins */
.wa-page-content {
  position: absolute;
  top: var(--wa-margin-top, 1in);
  right: var(--wa-margin-right, 1in);
  bottom: var(--wa-margin-bottom, 1in);
  left: var(--wa-margin-left, 1in);
  overflow: hidden;
}

/* Running header & footer margin bands (parsed from @page margin boxes) */
.wa-margin-top,
.wa-margin-bottom {
  position: absolute;
  left: var(--wa-margin-left, 1in);
  right: var(--wa-margin-right, 1in);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 0.2in;
  pointer-events: none;
}

.wa-margin-top {
  top: 0;
  height: var(--wa-margin-top, 1in);
  align-items: end;
  padding-bottom: 0.22in;
}

.wa-margin-bottom {
  bottom: 0;
  height: var(--wa-margin-bottom, 1in);
  align-items: start;
  padding-top: 0.22in;
}

.wa-margin-box {
  font-size: 8.5pt;
  line-height: 1.2;
  color: var(--muted-color);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.wa-top-left,
.wa-bottom-left { text-align: left; }
.wa-top-center,
.wa-bottom-center { text-align: center; }
.wa-top-right,
.wa-bottom-right { text-align: right; }

/* Paginated body flow (2-column handled explicitly by .wa-cols-2) */
.wa-pages .wa-body {
  column-count: 1 !important;
}

.wa-cols-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  column-gap: var(--column-gap, 0.28in);
  align-items: start;
}

.wa-col {
  min-width: 0;
}

.wa-col > :first-child,
.wa-flow-single > :first-child {
  margin-top: 0;
}

.wa-fragment-cont {
  text-indent: 0 !important;
  margin-top: 0 !important;
}

/* ==========================================================================
   Screen Sheet Presentation vs. Exact 1-to-1 Print Output
   ========================================================================== */

@media screen {
  html {
    background: #dfe3ea;
    min-height: 100%;
  }

  body {
    background: transparent;
    padding: 28px 20px 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  .wa-pages {
    gap: 24px;
  }

  .wa-page {
    box-shadow:
      0 1px 2px rgba(15, 23, 42, 0.08),
      0 10px 28px rgba(15, 23, 42, 0.14);
    border-radius: 2px;
  }

  /* Optional Margin Guides overlay toggled by View -> Toggle Margin Guides */
  html.wa-page-grid .wa-page-content::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px dashed rgba(37, 99, 235, 0.42);
    pointer-events: none;
  }
}

@media print {
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    background: transparent !important;
    width: auto !important;
    min-height: auto !important;
    display: block !important;

  #wa-root {
    transform: none !important;
  }

  .wa-pages {
    display: block !important;
    gap: 0 !important;
    padding: 0 !important;
    margin: 0 !important;
  }

  .wa-page {
    width: var(--page-width, 8.5in) !important;
    height: calc(var(--page-height, 11in) - 0.5px) !important;
    margin: 0 !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    break-after: page;
    page-break-after: always;
    break-inside: avoid;
    page-break-inside: avoid;
    overflow: hidden !important;
  }

  .wa-page:last-child {
    break-after: auto;
    page-break-after: auto;
  }
}

/* ==========================================================================
   Front-Matter Title Block & Cover
   ========================================================================== */

.title-block {
  margin-bottom: 1.6em;
}

.title-block.cover {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  margin-bottom: 0;
}

.title-block .category,
.title-block .organization {
  font-family: var(--heading-font);
  font-size: 0.85em;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent-color);
  margin: 0 0 0.45em;
  font-weight: 600;
}

.title-block .title {
  font-family: var(--heading-font);
  font-size: calc(var(--body-size) * var(--scale) * var(--scale) * var(--scale));
  line-height: 1.15;
  margin: 0 0 0.3em;
  color: var(--text-color);
  font-weight: 700;
}

.title-block .subtitle {
  font-family: var(--heading-font);
  font-size: calc(var(--body-size) * var(--scale));
  line-height: 1.35;
  margin: 0 0 0.7em;
  color: var(--muted-color);
  font-weight: 400;
}

.title-block .meta-line {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35em 1.25em;
  font-size: 0.92em;
  color: var(--muted-color);
  margin-top: 0.5em;
}

.title-block .author {
  font-weight: 600;
  color: var(--text-color);
}

.title-block .date {
  color: var(--muted-color);
}

.title-block .abstract {
  margin-top: 1.2em;
  padding: 0.9em 1.1em;
  background: var(--surface-color);
  border-left: 3px solid var(--accent-color);
  border-radius: var(--radius);
  font-size: 0.94em;
}

.title-block .abstract-label {
  font-family: var(--heading-font);
  font-weight: 700;
  font-size: 0.82em;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent-color);
  margin-bottom: 0.35em;
}

.title-block .keywords {
  margin-top: 0.75em;
  font-size: 0.86em;
  color: var(--muted-color);
}

.title-block .keywords strong {
  color: var(--text-color);
}

/* ==========================================================================
   Headings & Typography
   ========================================================================== */

h1, h2, h3, h4, h5, h6 {
  font-family: var(--heading-font);
  color: var(--text-color);
  line-height: 1.22;
  margin-top: 1.35em;
  margin-bottom: 0.45em;
  font-weight: 700;
}

h1 { font-size: calc(var(--body-size) * var(--scale) * var(--scale)); }
h2 { font-size: calc(var(--body-size) * var(--scale) * 1.22); }
h3 { font-size: calc(var(--body-size) * var(--scale)); }
h4 { font-size: calc(var(--body-size) * 1.08); }
h5 { font-size: var(--body-size); }
h6 { font-size: calc(var(--body-size) * 0.92); color: var(--muted-color); }

p {
  margin: 0 0 var(--paragraph-spacing);
  text-indent: var(--paragraph-indent);
}

h1 + p, h2 + p, h3 + p, h4 + p, h5 + p, h6 + p,
blockquote + p, ul + p, ol + p, table + p, figure + p, hr + p, .callout + p {
  text-indent: 0;
}

a {
  color: var(--accent-color);
  text-decoration: underline;
  text-underline-offset: 2px;
  text-decoration-thickness: 1px;
}

hr {
  border: 0;
  border-top: 1px solid var(--border-color);
  margin: 1.4em 0;
}

/* ==========================================================================
   Lists & Task Lists
   ========================================================================== */

ul, ol {
  margin: 0 0 var(--paragraph-spacing);
  padding-left: 1.5em;
}

li {
  margin-bottom: 0.25em;
}

li > ul, li > ol {
  margin-top: 0.25em;
  margin-bottom: 0.25em;
}

ul.contains-task-list,
li.task-list-item {
  list-style: none;
}

li.task-list-item {
  margin-left: -1.1em;
}

li.task-list-item input[type="checkbox"] {
  margin-right: 0.45em;
  accent-color: var(--accent-color);
  vertical-align: middle;
}

/* ==========================================================================
   Blockquotes, Pull Quotes & Sidebars
   ========================================================================== */

blockquote {
  margin: 1em 0;
  padding: 0.6em 1.1em;
  border-left: 3px solid var(--accent-color);
  background: var(--surface-color);
  color: var(--text-color);
  border-radius: 0 var(--radius) var(--radius) 0;
}

blockquote > :first-child { margin-top: 0; }
blockquote > :last-child { margin-bottom: 0; }

.pull-quote {
  margin: 1.25em 0;
  padding: 0.85em 1.2em;
  border-left: 0;
  border-top: 2px solid var(--accent-color);
  border-bottom: 1px solid var(--border-color);
  background: transparent;
  font-family: var(--heading-font);
  font-size: 1.18em;
  font-style: italic;
  line-height: 1.4;
  color: var(--accent-color);
}

.sidebar {
  margin: 1.1em 0;
  padding: 0.9em 1.1em;
  background: var(--surface-color);
  border: 1px solid var(--border-color);
  border-left: 3px solid var(--accent-secondary);
  border-radius: var(--radius);
  font-size: 0.92em;
}

/* ==========================================================================
   Callouts / GitHub Alerts
   ========================================================================== */

.callout {
  margin: 1em 0;
  padding: 0.78em 1.05em;
  border-radius: var(--radius);
  border: 1px solid var(--border-color);
  border-left: 4px solid var(--accent-color);
  background: var(--surface-color);
}

.callout-title {
  font-family: var(--heading-font);
  font-weight: 700;
  font-size: 0.88em;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 0.35em;
  color: var(--accent-color);
  display: flex;
  align-items: center;
  gap: 0.45em;
}

.callout-body > :first-child { margin-top: 0; }
.callout-body > :last-child { margin-bottom: 0; }

.callout-note { border-left-color: #2563eb; }
.callout-note .callout-title { color: #1d4ed8; }

.callout-tip { border-left-color: #15803d; }
.callout-tip .callout-title { color: #166534; }

.callout-important { border-left-color: #7c3aed; }
.callout-important .callout-title { color: #6d28d9; }

.callout-warning { border-left-color: #b45309; }
.callout-warning .callout-title { color: #92400e; }

.callout-caution { border-left-color: #b91c1c; }
.callout-caution .callout-title { color: #991b1b; }

/* ==========================================================================
   Tables
   ========================================================================== */

table {
  width: 100%;
  border-collapse: collapse;
  margin: 1.05em 0;
  font-size: 0.92em;
  line-height: 1.4;
}

th, td {
  padding: 0.48em 0.62em;
  text-align: left;
  border-bottom: 1px solid var(--border-color);
  vertical-align: top;
  overflow-wrap: anywhere;
}

th {
  font-family: var(--heading-font);
  font-weight: 700;
  color: var(--text-color);
  background: var(--surface-color);
  border-top: 1.5px solid var(--text-color);
  border-bottom: 1.5px solid var(--text-color);
}

/* ==========================================================================
   Code & Preformatted Blocks
   ========================================================================== */

code {
  font-family: var(--code-font);
  font-size: 0.86em;
  background: var(--surface-color);
  padding: 0.12em 0.35em;
  border-radius: 3px;
  overflow-wrap: anywhere;
}

pre {
  margin: 0.95em 0;
  padding: 0.8em 1em;
  background: var(--surface-color);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  overflow-x: visible;
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.45;
}

pre code {
  background: transparent;
  padding: 0;
  font-size: 0.84em;
  border-radius: 0;
}

/* ==========================================================================
   Images & Figures
   ========================================================================== */

img {
  max-width: 100%;
  height: auto;
  display: inline-block;
}

.figure {
  margin: 1.15em auto;
  text-align: center;
}

.figure img {
  display: block;
  margin: 0 auto;
  max-width: 100%;
  max-height: 4.5in;
  object-fit: contain;
  border-radius: var(--radius);
}

.caption {
  margin-top: 0.45em;
  font-size: 0.86em;
  color: var(--muted-color);
  font-style: italic;
}

/* ==========================================================================
   Table of Contents
   ========================================================================== */

.toc {
  margin: 1.15em 0 1.45em;
  padding: 0.85em 1.15em;
  background: var(--surface-color);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
}

.toc-title {
  font-family: var(--heading-font);
  font-weight: 700;
  font-size: 0.95em;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent-color);
  margin-bottom: 0.45em;
}

.toc-list {
  list-style: none;
  margin: 0;
  padding: 0;
  font-size: 0.92em;
}

.toc-list li {
  margin: 0.2em 0;
}

.toc-list .toc-h2 { padding-left: 1.1em; }
.toc-list .toc-h3 { padding-left: 2.2em; font-size: 0.94em; color: var(--muted-color); }

.toc-list a {
  text-decoration: none;
  color: var(--text-color);
}

.toc-list a:hover {
  color: var(--accent-color);
  text-decoration: underline;
}

/* ==========================================================================
   Footnotes
   ========================================================================== */

.footnote-ref a {
  text-decoration: none;
  font-weight: 600;
  padding: 0 0.1em;
}

.footnotes {
  margin-top: 1.6em;
  padding-top: 0.75em;
  border-top: 1px solid var(--border-color);
  font-size: 0.86em;
  color: var(--muted-color);
}

.footnotes.wa-footnotes-cont {
  margin-top: 0;
  border-top: 0;
  padding-top: 0;
}

.footnotes ol {
  margin: 0.4em 0 0;
  padding-left: 1.4em;
}

.footnotes li {
  margin-bottom: 0.3em;
}

.footnotes p {
  margin: 0;
  display: inline;
  text-indent: 0;
}

.footnote-backref {
  text-decoration: none;
  margin-left: 0.35em;
}

/* ==========================================================================
   Utility Document Classes
   ========================================================================== */

.lead {
  font-size: 1.12em;
  line-height: 1.55;
  color: var(--muted-color);
}

.small-caps {
  font-variant-caps: small-caps;
  letter-spacing: 0.04em;
}

.drop-cap::first-letter {
  float: left;
  font-family: var(--heading-font);
  font-size: 3.2em;
  line-height: 0.82;
  padding-right: 0.12em;
  padding-top: 0.05em;
  font-weight: 700;
  color: var(--accent-color);
}

.two-col {
  column-count: 2;
  column-gap: var(--column-gap, 0.3in);
}

.signature-block {
  margin-top: 1.8em;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(2.2in, 1fr));
  gap: 1.5em;
}

.header, .footer {
  font-size: 0.84em;
  color: var(--muted-color);
}
