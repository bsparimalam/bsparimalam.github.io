<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key Speaker — Learn Letters &amp; Numbers</title>
  <meta name="description"
    content="Press any key to see it displayed full-screen and hear it spoken aloud. A fun, interactive way to learn letters and numbers.">

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA / home-screen meta -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Key Speaker">
  <link rel="apple-touch-icon" href="images/icon-192.png">

  <!-- Theme colour for browser chrome -->
  <meta name="theme-color" content="#000000">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Left / Top: character display -->
  <div id="main-area">
    <p id="prompt">Tap a letter or press a key</p>
    <div id="display-area">
      <div id="letter" aria-live="assertive" role="alert"></div>
      <div id="word-panel">
        <img id="word-image" src="" alt="">
        <p id="word-label"></p>
      </div>
    </div>
    <p id="footer">Key Speaker</p>
  </div>

  <!-- Right / Bottom: clickable buttons -->
  <div id="button-panel">
    <div id="btn-row-letters">
      <!-- A–Z injected by JS -->
    </div>
    <div id="btn-row-numbers">
      <!-- 0–9 injected by JS -->
    </div>
  </div>

  <!-- Floating play / pause -->
  <button id="play-btn" aria-label="Play auto-cycle" title="Auto-play A–Z then 0–9">
    <span id="play-icon">&#9654;</span>
  </button>

  <!-- Custom cursor (mouse-only, hidden on touch devices) -->
  <div id="custom-cursor"></div>

  <script src="app.js"></script>

  <!-- Register service worker for PWA / offline support -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('[SW] Registered, scope:', reg.scope))
          .catch(err => console.warn('[SW] Registration failed:', err));
      });
    }
  </script>
</body>

</html>
