<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key Speaker — Learn Letters & Numbers</title>
  <meta name="description"
    content="Press any key to see it displayed full-screen and hear it spoken aloud. A fun, interactive way to learn letters and numbers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <p id="prompt">Press any key</p>
  <div id="display-area">
    <div id="letter" aria-live="assertive" role="alert"></div>
    <div id="word-panel">
      <img id="word-image" src="" alt="">
      <p id="word-label"></p>
    </div>
  </div>
  <p id="footer">Key Speaker</p>

  <script src="app.js"></script>
</body>

</html>
