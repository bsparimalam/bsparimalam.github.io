<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Sentence</title>
    <meta name="description" content="A word processor that saves Markdown, with local AI autocomplete and grammar check." />
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1f26" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mdwp-anthropic-sdk" content="./assets/anthropic-2ANFSZPA.js" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./assets/styles-Z4IBOITW.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="7" fill="currentColor" /><path d="M7 22V10h3l3 4 3-4h3v12h-3v-7l-3 4-3-4v7zm16 0-4-5h2.5v-7h3v7H27z" fill="#fff" /></svg>
        </div>
        <div class="doc-meta">
          <div class="title-line">
            <button id="doc-title" type="button" title="Rename / Save as…"><span id="doc-name">Untitled</span><span id="doc-ext">.md</span></button>
            <span id="save-state" aria-live="polite"></span>
          </div>
          <nav id="menubar" role="menubar" aria-label="Main menu"></nav>
        </div>
      </header>
      <div id="toolbar" role="toolbar" aria-label="Formatting"></div>
      <div id="workspace">
        <aside id="outline-panel" class="side-panel left" aria-label="Document outline">
          <div class="panel-header"><h3>Outline</h3></div>
          <div id="outline-list"></div>
        </aside>
        <div id="editor-area" data-split="off">
          <div id="doc-area">
            <main id="scroller">
              <div id="page-wrap">
                <div id="page" class="page">
                  <div id="page-bands" aria-hidden="true"></div>
                  <div id="editor"></div>
                  <textarea id="source" spellcheck="false" aria-label="Markdown source"></textarea>
                </div>
              </div>
            </main>
            <div id="findbar" hidden></div>
          </div>
          <div id="split-divider" role="separator" aria-orientation="vertical" aria-label="Resize Markdown pane" tabindex="0" hidden></div>
          <section id="split-pane" aria-label="Markdown" hidden>
            <div class="split-header">
              <span class="split-title">Markdown</span>
              <span class="split-hint">Edits here update the document</span>
              <button type="button" class="icon-btn" id="split-close" title="Close split view" aria-label="Close split view">✕</button>
            </div>
            <textarea id="split-source" spellcheck="false" aria-label="Markdown source (split view)"></textarea>
          </section>
        </div>
        <aside id="grammar-panel" class="side-panel right" aria-label="Grammar suggestions"></aside>
      </div>
      <footer id="statusbar"></footer>
    </div>
    <div id="popover" class="popover" hidden role="dialog" aria-label="Suggestion"></div>
    <div id="toasts" aria-live="polite"></div>
    <script defer src="./assets/app-C534BVYA.js"></script>
  </body>
</html>
